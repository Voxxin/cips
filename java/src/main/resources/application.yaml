spring:
  application:
    name: cips-middleware

  datasource:
    url: jdbc:postgresql://localhost:5432/cips
    username: cips_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
#    baseline-on-migrate: true

server:
  port: 8080